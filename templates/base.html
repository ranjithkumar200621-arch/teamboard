<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ title or 'Teamboard' }}</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body><header><a class="brand" href="/">Teamboard<span>.</span></a><nav>{% if current_user %}<span>{{ current_user.name }}</span><form action="/logout" method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="text-button">Sign out</button></form>{% else %}<a href="/login">Sign in</a><a href="/register">Join</a>{% endif %}</nav></header><main>{% for message in get_flashed_messages() %}<div class="alert">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main><footer>Built for focused teamwork</footer></body></html>
