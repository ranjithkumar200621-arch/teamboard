{% extends 'base.html' %}{% block content %}<section class="auth card"><p class="eyebrow">TEAMBOARD</p><h1>{{ title }}</h1><form method="post"><input type="hidden" name="csrf" value="{{ csrf }}">{% if action == 'register' %}<label>Name<input name="name" required></label>{% endif %}<label>Email<input type="email" name="email" required></label><label>Password<input type="password" name="password" minlength="8" required></label><button class="button">{{ title }}</button></form><p>{% if action == 'login' %}New here? <a href="/register">Create an account</a>{% else %}Already a member? <a href="/login">Sign in</a>{% endif %}</p></section>{% endblock %}
